name: protopipe-scaffold

x-rust-env: &rust-env
  RUST_LOG: info
  BIND_ADDR: 0.0.0.0:8080
  UPSTREAM_BASE_URL: http://wiremock:8080

services:
  rust-example:
    build:
      context: ./services/rust-example
      dockerfile: Containerfile
    environment:
      <<: *rust-env
    ports:
      - "8080:8080"
    depends_on:
      - wiremock
    profiles:
      - dev
      - test
      - load
      - ci

  wiremock:
    image: wiremock/wiremock:3.13.2
    command:
      - --global-response-templating
      - --verbose
    ports:
      - "8081:8080"
    profiles:
      - dev
      - test
      - load
      - ci

  test-bdd:
    image: rust:1.95-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace:Z
    environment:
      SERVICE_BASE_URL: http://rust-example:8080
      WIREMOCK_BASE_URL: http://wiremock:8080
      CUCUMBER_FEATURES: /workspace/tests/bdd/features
    command:
      - cargo
      - test
      - --manifest-path
      - tests/bdd/Cargo.toml
      - --test
      - cucumber
    depends_on:
      - rust-example
      - wiremock
    profiles:
      - test
      - ci

  test-load:
    image: grafana/k6:1.0.0
    working_dir: /scripts
    volumes:
      - ./tests/load:/scripts:Z
    environment:
      SERVICE_BASE_URL: http://rust-example:8080
      WIREMOCK_BASE_URL: http://wiremock:8080
    command:
      - run
      - /scripts/hello-smoke.js
    depends_on:
      - rust-example
      - wiremock
    profiles:
      - load

  docs:
    image: squidfunk/mkdocs-material:9
    working_dir: /docs
    volumes:
      - .:/docs:Z
    ports:
      - "8000:8000"
    command:
      - serve
      - -f
      - mkdocs.yaml
      - --dev-addr=0.0.0.0:8000
    profiles:
      - docs
